server:
  port: 8080
spring:
  application:
    name: file-storage-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
storage:
  provider: ${STORAGE_PROVIDER:do-spaces}
  bucket-name: ${STORAGE_BUCKET_NAME}
  region: ${STORAGE_REGION:nyc3}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
