server:
  port: 8080
spring:
  application:
    name: file-storage-service
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:2MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:2MB}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      schema: ${DATABASE_SCHEMA:public}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:public}
  flyway:
    enabled: true
    default-schema: ${DATABASE_SCHEMA:public}
    schemas: ${DATABASE_SCHEMA:public}
    create-schemas: true
storage:
  provider: ${STORAGE_PROVIDER:cloudflare-r2}
  bucket-name: ${STORAGE_BUCKET_NAME}
  account-id: ${STORAGE_ACCOUNT_ID}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
